services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minerva_backend
    # El entrypoint elige uvicorn (dev) o gunicorn (prod) según MINERVA_MODE (ver .env).
    command: /app/scripts/backend-entrypoint.sh
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      # MINERVA_MANIFESTS_PATH es específico de Docker (ruta dentro del contenedor);
      # el resto de la config Dev Kit (MINERVA_MODE, MINERVA_DB_URL, MINERVA_JWT_*, etc.)
      # viene íntegramente de .env, que es la única fuente de verdad.
      MINERVA_MANIFESTS_PATH: /app/manifests
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      # uvicorn/gunicorn honran X-Forwarded-For → request.client.host es la IP real
      # (rate limit por cliente, no por la IP de nginx).
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./backend:/app
      - ./manifests:/app/manifests
    depends_on:
      postgres:
        condition: service_healthy
      minerva_redis:
        condition: service_healthy
    networks:
      minerva_network:
        aliases:
          - minerva

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minerva_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - minerva_network

  minerva_redis:
    image: redis:7-alpine
    container_name: minerva_redis
    restart: unless-stopped
    # Sin persistencia (RDB/AOF) a propósito: Redis aquí solo guarda rate limiting,
    # blacklist de tokens y sesiones efímeras de /authorize (ver MINERVA dependencies
    # en backend/app/core/config.py), nunca la fuente de verdad de datos. Perder este
    # estado en un restart solo relaja temporalmente el rate-limiting; no corrompe nada.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      minerva_network:
        aliases:
          - minerva-redis

  postgres:
    image: postgres:16-alpine
    container_name: minerva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minerva
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - minerva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      minerva_network:
        aliases:
          - minerva-db

volumes:
  minerva_postgres_data:

networks:
  minerva_network:
    driver: bridge
