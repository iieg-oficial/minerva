services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minerva_backend
    # El entrypoint elige uvicorn (dev) o gunicorn (prod) según MINERVA_MODE (ver .env).
    command: /app/scripts/backend-entrypoint.sh
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      # MINERVA_MANIFESTS_PATH es específico de Docker (ruta dentro del contenedor);
      # el resto de la config Dev Kit (MINERVA_MODE, MINERVA_DB_URL, MINERVA_JWT_*, etc.)
      # viene íntegramente de .env, que es la única fuente de verdad.
      MINERVA_MANIFESTS_PATH: /app/manifests
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      # uvicorn/gunicorn solo honran X-Forwarded-For si la conexión viene de nginx (su IP
      # fija en la red interna). Nunca "*": cualquiera que alcanzara el backend podría
      # elegir su IP y esquivar el rate limit. nginx ya manda un único valor resuelto.
      FORWARDED_ALLOW_IPS: ${MINERVA_PROXY_IP:-172.22.0.10}
    volumes:
      - ./backend:/app
      - ./manifests:/app/manifests
    depends_on:
      postgres:
        condition: service_healthy
      minerva_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      minerva_network:
        aliases:
          - minerva

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minerva_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Proxy (IP o CIDR) cuyo X-Forwarded-For se cree, p. ej. el reverse proxy o gateway
      # que va delante. El default no confía en nadie. Ver frontend/nginx.conf.
      MINERVA_TRUSTED_PROXY: ${MINERVA_TRUSTED_PROXY:-127.0.0.1/32}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      minerva_network:
        # IP fija: es la única en la que confía el backend (FORWARDED_ALLOW_IPS).
        ipv4_address: ${MINERVA_PROXY_IP:-172.22.0.10}

  minerva_redis:
    image: redis:7-alpine
    container_name: minerva_redis
    restart: unless-stopped
    # Redis es control de seguridad, no solo caché: guarda la blacklist de `jti`
    # revocados, los cortes de invalidación por usuario y el contenedor de sesión del
    # panel (BFF). Por eso corre con persistencia AOF (`appendonly yes`, sobrevive
    # reinicios) y `noeviction` (nunca desaloja una revocación por presión de memoria).
    # Todas las claves tienen TTL acotado (blacklist ≤ vida del token, panel 8h,
    # rate-limit 15min), así que 256mb sobra; con `noeviction`, si la memoria se llenara,
    # fallan las escrituras (fail-closed) en vez de resucitar tokens revocados en silencio.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - minerva_redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      minerva_network:
        aliases:
          - minerva-redis

  postgres:
    image: postgres:16-alpine
    container_name: minerva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minerva
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - minerva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      minerva_network:
        aliases:
          - minerva-db

volumes:
  minerva_postgres_data:
  minerva_redis_data:

networks:
  minerva_network:
    driver: bridge
    # Subred fija para poder dar a nginx una IP estable. Si choca con otra red del host,
    # cambia MINERVA_SUBNET y MINERVA_PROXY_IP juntos (la IP debe caer dentro de la subred).
    ipam:
      config:
        - subnet: ${MINERVA_SUBNET:-172.22.0.0/24}
