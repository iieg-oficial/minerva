services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minerva_backend
    command: /app/scripts/backend-entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port 9000 --reload
    ports:
      - "${BACKEND_PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      # MINERVA_MANIFESTS_PATH es específico de Docker (ruta dentro del contenedor);
      # el resto de la config Dev Kit (MINERVA_MODE, MINERVA_DB_URL, MINERVA_JWT_*, etc.)
      # viene íntegramente de .env, que es la única fuente de verdad.
      MINERVA_MANIFESTS_PATH: /app/manifests
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./backend:/app
      - ./manifests:/app/manifests
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      minerva_network:
        aliases:
          - minerva

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minerva_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - minerva_network

  postgres:
    image: postgres:16-alpine
    container_name: minerva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minerva
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - minerva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      minerva_network:
        aliases:
          - minerva-db

volumes:
  minerva_postgres_data:

networks:
  minerva_network:
    driver: bridge
