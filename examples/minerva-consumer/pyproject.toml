[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minerva-consumer-example"
version = "0.1.0"
description = "Consumidor mock de Minerva: login, sesión, permisos, refresh y logout"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Se satisface con el `sdk/` de este mismo repo: el Dockerfile lo copia a
    # /opt/minerva-sdk y el flujo local usa `pip install -e ../../sdk`. Fuera del
    # monorepo se declara como requisito VCS (ver sdk/README.md); NUNCA se resuelve
    # contra el `minerva-sdk` de PyPI, que es un paquete ajeno.
    "minerva-sdk>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["minerva_example"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
