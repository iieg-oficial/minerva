# Gateway de PRUEBA para validar el forward auth de Minerva en local.
# Replica minimamente el server :443 de gateway-hub (sin SSL, en :80).
#
# Los upstreams se definen aqui (no se reusa gateway/upstreams.conf) porque en
# prueba `acervo_console` apunta al dummy en vez de a acervo-seaweedfs. Es
# exactamente lo que hara gateway-hub: mismos snippets, distinta definicion de
# upstream segun el entorno.

upstream minerva {
    server minerva-server:9000;
    keepalive 16;
}

# Produccion: acervo-seaweedfs:8888 — Prueba: el contenedor dummy whoami.
upstream acervo_console {
    server minerva-test-console:80;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name localhost;

    location = / {
        default_type text/plain;
        return 200 "Minerva test gateway OK. Probar:\n  /auth/            -> UI de Authentik\n  /acervo/console/  -> app protegida por forward auth\n";
    }

    include /etc/nginx/includes/minerva.locations.inc;
    include /etc/nginx/includes/acervo-console.locations.inc;
}
