# Ambiente de prueba local de Minerva.
#
# Valida el flujo completo de forward auth SIN tocar el ecosistema real:
#   navegador -> gateway-test (nginx) -> auth_request -> embedded outpost
#                -> login Authentik -> app dummy protegida
#
# Requisitos: el stack principal (docker-compose.yml) debe estar arriba, ya que
# este compose se conecta a su red `minerva-net` y al contenedor minerva-server.
#
# Uso:  make test-up  /  make test-down   (ver Makefile)
name: minerva-test

services:
  # Hace de "consola de Acervo": en produccion este upstream es acervo-seaweedfs:8888.
  console-dummy:
    image: traefik/whoami:latest
    container_name: minerva-test-console
    command: --name "Consola de Acervo (DUMMY de prueba)"
    networks:
      - minerva-net
    restart: unless-stopped

  # Replica minimamente el server :443 de gateway-hub (sin SSL, en :80).
  # Monta los MISMOS snippets que se copiaran a gateway-hub — si funcionan aqui,
  # funcionan alla.
  gateway-test:
    image: nginx:1.28-alpine
    container_name: minerva-test-gateway
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx-test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-params.inc:/etc/nginx/includes/proxy-params.inc:ro
      - ../gateway/minerva.locations.inc:/etc/nginx/includes/minerva.locations.inc:ro
      - ../gateway/acervo-console.locations.inc:/etc/nginx/includes/acervo-console.locations.inc:ro
    depends_on:
      - console-dummy
    networks:
      - minerva-net
    restart: unless-stopped

networks:
  minerva-net:
    external: true
