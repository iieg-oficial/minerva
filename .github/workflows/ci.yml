name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # Reutilizable: `docker-publish.yml` lo invoca como gate antes de subir imágenes a ghcr,
  # así la publicación de un tag corre estos mismos jobs sobre el commit etiquetado.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c constraints.txt # misma resolución que la imagen Docker
      - run: ruff check app alembic tests
      - run: ruff format --check app alembic tests
      - run: mypy app # gate de tipos: falla ante errores nuevos (deuda actual en cuarentena, ver pyproject)
      - run: pytest tests/ -v # SQLite + fakeredis, sin servicios externos

  backend-postgres:
    # Las garantías que SQLite no reproduce (advisory lock del seed, trigger PL/pgSQL,
    # índices únicos parciales, lock de fila del refresh) solo se prueban con PostgreSQL
    # real. Sin este job esos tests se saltan y el verde no dice nada de ellos.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: minerva
          # El nombre DEBE terminar en `_test`: `require_test_database_url` aborta si no,
          # porque estos tests dropean y recrean el esquema public.
          POSTGRES_DB: minerva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MINERVA_TEST_POSTGRES_URL: postgresql+psycopg://minerva:minerva@localhost:5432/minerva_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -c constraints.txt
      # Sin la variable los tests se saltan en silencio y el job quedaría verde sin haber
      # probado nada: es justo el agujero que este job viene a cerrar.
      - run: test -n "$MINERVA_TEST_POSTGRES_URL"
      - run: pytest tests/test_*_pg.py -v # solo los PG-only; Redis sigue siendo fakeredis

  audit:
    # Escaneo de vulnerabilidades sobre la resolución congelada. Corre en su propio job
    # para no meter pip-audit (ni sus dependencias) en el entorno que valida el backend.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # EXCEPCIÓN ACOTADA — PYSEC-2026-1325 (CVE-2024-23342), ecdsa 0.19.2:
      #   Minerva timing attack contra P-256 al FIRMAR con `ecdsa`. Upstream declara los
      #   side channels fuera de alcance y no hay versión corregida (afecta a todas).
      #   No alcanzable aquí: `ecdsa` entra solo como transitiva de `python-jose`, que con
      #   `[cryptography]` instalado usa el backend de `cryptography` para claves EC; y
      #   Minerva firma y valida SOLO RS256 (`algorithms=["RS256"]`), sin curvas EC.
      #   Revisar el 2027-02-05, o antes si `python-jose` suelta `ecdsa` o aparece un fix.
      # El scan sigue vivo: cualquier alerta distinta a esta rompe el job.
      - run: pip-audit -r constraints.txt --no-deps --ignore-vuln PYSEC-2026-1325

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check minerva_sdk tests
      - run: ruff format --check minerva_sdk tests
      - run: pytest tests/ -v # doble de httpx, sin red
      - run: pip install -e "../examples/minerva-consumer[dev]"
      - run: ruff check ../examples/minerva-consumer/minerva_example ../examples/minerva-consumer/tests
      - run: ruff format --check ../examples/minerva-consumer/minerva_example ../examples/minerva-consumer/tests
      - run: pytest tests/ -v # referencia ejecutable, Minerva simulada
        working-directory: examples/minerva-consumer

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Vite 8 exige ^20.19.0 || >=22.12.0; 22 es además la de `frontend/Dockerfile`,
          # así que el CI y la imagen compilan con el mismo runtime.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node --check ../examples/minerva-consumer/minerva_example/frontend/api.js
      - run: node --check ../examples/minerva-consumer/minerva_example/frontend/app.js
      - run: node --check ../examples/minerva-consumer/minerva_example/frontend/views.js
      - run: npm run build
      - run: npm test # vitest; sin esto los tests del panel existen pero no los corre nadie

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cp .env.example .env # compose exige el .env (gitignored)
      - run: docker compose config
      - run: docker compose build
      - run: docker compose --env-file examples/minerva-consumer/.env.example -f examples/minerva-consumer/compose.yml config
      - run: docker build -f examples/minerva-consumer/Dockerfile -t minerva-consumer-example:test .
