name: Publicar imágenes

# Publica backend y frontend a ghcr.io al crear un tag de release (vX.Y.Z).
# Las imágenes heredan la visibilidad del repo (privado -> privadas): solo
# miembros de la org con acceso pueden hacer pull. No requiere secretos: el
# GITHUB_TOKEN del job ya trae permiso de escritura a packages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    # Gate del release: corre el CI completo (backend, PostgreSQL, audit, SDK, frontend y
    # docker) sobre el MISMO commit del tag — al invocarse con una ruta local, el workflow
    # reutilizable se ejecuta en el ref del llamador. Antes el tag publicaba sin verde.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # el CI no necesita `packages: write`; no se le hereda

  publish:
    needs: validate # si cualquier job del CI falla, no se sube nada a ghcr
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/minerva-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
