[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minerva-sdk"
# Ciclo de versionado propio, independiente del servidor (ver "Versionado" en el README
# raíz): no tiene por qué coincidir con backend/pyproject.toml.
version = "0.3.0"
description = "SDK mínimo de Minerva para sistemas consumidores (FastAPI)"
# Apache-2.0, NO la AGPL-3.0 del resto del repo: esta librería la importan los sistemas
# consumidores en su propio código y no debe imponerles el copyleft del servidor.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
# `cryptography` entra transitivamente por python-jose, pero los tests la importan
# directo para generar pares RSA: se declara para no depender de esa transitividad.
dev = ["pytest>=8.0", "cryptography>=42.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["minerva_sdk"]

[tool.ruff]
# Mismo ancho que el backend (ver backend/pyproject.toml): el default de ruff son 88.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
