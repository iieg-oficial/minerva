[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minerva-sdk"
version = "0.2.0"
description = "SDK mínimo de Minerva para sistemas consumidores (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["minerva_sdk"]
