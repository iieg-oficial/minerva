# HSTS NO se emite aquí a propósito: este nginx sirve solo HTTP (`listen 80`) y el
# deploy va detrás de un terminador TLS externo (ver docker-compose.deploy.yml). HSTS
# debe emitirlo ese terminador (los navegadores además ignoran un HSTS recibido por
# HTTP). Directiva recomendada allí, SIN `preload` por defecto (es difícil de revertir
# y exige HTTPS en todos los subdominios):
#   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras defensivas (OWASP). style-src permite 'unsafe-inline' porque Ant
    # Design 6 (@ant-design/cssinjs) inyecta <style> en runtime sin nonce. img-src
    # incluye https: porque el branding de una app puede traer un logo por URL pública
    # (logo_url). frame-ancestors 'none' bloquea el clickjacking. Se repiten en
    # location /assets/ porque un add_header propio en un location hijo rompe la
    # herencia del padre.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cabeceras de proxy, heredadas por las locations con proxy_pass. Con
    # X-Forwarded-For + FORWARDED_ALLOW_IPS en el backend, el rate limit ve la IP
    # real del cliente (no la de nginx). X-Forwarded-Proto deja listo el paso a
    # HTTPS (issuer/scheme) sin tocar nada más.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Bundles con hash de contenido → cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repetidos: este location define su propio add_header (Cache-Control) y eso
        # anula la herencia de los headers de seguridad del bloque server.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- Backend: consumidores OIDC en la raíz del issuer (preservan el path) ---
    location /.well-known/ { proxy_pass http://backend:9000; }
    location /userinfo     { proxy_pass http://backend:9000; }
    location /auth/        { proxy_pass http://backend:9000; }

    # SDK / Dev Kit: el devkit vive en /api/v1 en el backend (preserva el path).
    # Va ANTES de /api/ para ganar el prefijo por longest-match.
    location /api/v1/ { proxy_pass http://backend:9000; }

    # Panel admin: la SPA llama /api/* y el backend expone las rutas en la raíz →
    # la barra final del proxy_pass elimina el prefijo /api (/api/auth/me → /auth/me).
    location /api/ { proxy_pass http://backend:9000/; }

    # SPA: rutas client-side (/login, /admin, /authorize, ...).
    location / {
        try_files $uri /index.html;
    }
}
