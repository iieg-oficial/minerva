# Compose para consumir Minerva SIN clonar el repo.
# El equipo solo necesita este archivo + un .env. Requiere haber hecho antes:
#   echo $GHCR_PAT | docker login ghcr.io -u <usuario-github> --password-stdin
# donde GHCR_PAT es un token con scope read:packages.
#
# Ajusta MINERVA_ORG y MINERVA_VERSION (o expórtalos en el entorno).
services:
  backend:
    image: ghcr.io/${MINERVA_ORG:-iieg-oficial}/minerva-backend:${MINERVA_VERSION:-latest}
    container_name: minerva_backend
    restart: unless-stopped
    command: /app/scripts/backend-entrypoint.sh
    # El backend NO publica puerto: el único punto público es nginx (servicio
    # frontend), que proxea /auth, /userinfo, /.well-known, /api y /api/v1 al
    # backend por la red interna. Así el issuer queda en http://<host> (sin :9000)
    # y confiar en X-Forwarded-For es seguro (solo nginx alcanza al backend).
    env_file:
      - .env
    environment:
      MINERVA_MANIFESTS_PATH: /app/manifests
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      # uvicorn/gunicorn solo honran X-Forwarded-For si la conexión viene de nginx (su IP
      # fija en la red interna). Nunca "*": cualquiera que alcanzara el backend podría
      # elegir su IP y esquivar el rate limit. nginx ya manda un único valor resuelto.
      FORWARDED_ALLOW_IPS: ${MINERVA_PROXY_IP:-172.22.0.10}
    volumes:
      # Los manifests NO van dentro de la imagen (viven fuera del build context).
      # Pon aquí una carpeta ./manifests con tus *.minerva.yml para que se
      # auto-importen al arrancar. Si no existe, Minerva bootea sin apps y las
      # importas después vía API/panel. Es la única carpeta del repo que necesitas.
      - ./manifests:/app/manifests
    depends_on:
      postgres:
        condition: service_healthy
      minerva_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      minerva_network:
        aliases:
          - minerva

  frontend:
    image: ghcr.io/${MINERVA_ORG:-iieg-oficial}/minerva-frontend:${MINERVA_VERSION:-latest}
    container_name: minerva_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      # Proxy (IP o CIDR) cuyo X-Forwarded-For se cree, p. ej. el reverse proxy o gateway
      # que va delante. El default no confía en nadie. Ver frontend/nginx.conf.
      MINERVA_TRUSTED_PROXY: ${MINERVA_TRUSTED_PROXY:-127.0.0.1/32}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      minerva_network:
        # IP fija: es la única en la que confía el backend (FORWARDED_ALLOW_IPS).
        ipv4_address: ${MINERVA_PROXY_IP:-172.22.0.10}

  minerva_redis:
    image: redis:7-alpine
    container_name: minerva_redis
    restart: unless-stopped
    # Redis es control de seguridad (blacklist de `jti`, cortes de invalidación por
    # usuario y sesiones del panel BFF): persistencia AOF para sobrevivir reinicios y
    # `noeviction` para no desalojar revocaciones por presión de memoria. Ver docs/despliegue.md §3.4.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - minerva_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      minerva_network:
        aliases:
          - minerva-redis

  postgres:
    image: postgres:16-alpine
    container_name: minerva_postgres
    restart: unless-stopped
    environment:
      # En producción define POSTGRES_PASSWORD en el .env con un valor fuerte,
      # y asegúrate de que MINERVA_DB_URL use esa misma contraseña.
      POSTGRES_DB: ${POSTGRES_DB:-minerva}
      POSTGRES_USER: ${POSTGRES_USER:-minerva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minerva}
    volumes:
      - minerva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      minerva_network:
        aliases:
          - minerva-db

volumes:
  minerva_postgres_data:
  minerva_redis_data:

networks:
  minerva_network:
    driver: bridge
    # Subred fija para poder dar a nginx una IP estable. Si choca con otra red del host,
    # cambia MINERVA_SUBNET y MINERVA_PROXY_IP juntos (la IP debe caer dentro de la subred).
    ipam:
      config:
        - subnet: ${MINERVA_SUBNET:-172.22.0.0/24}
