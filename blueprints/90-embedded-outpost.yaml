# Embedded outpost — lista de Proxy Providers que valida el forward auth.
#
# El embedded outpost corre dentro de minerva-server y expone el endpoint
# /outpost.goauthentik.io/ que gateway-hub consulta via auth_request.
#
# IMPORTANTE: cada Proxy Provider nuevo (modo proxy/forward_*) debe agregarse a
# la lista `providers` de abajo, o el outpost no lo conocera. Los OIDC providers
# NO van aqui (esos los consume cada app directamente).
version: 1
metadata:
  name: IIEG - Embedded outpost (proxy providers)
  labels:
    blueprints.goauthentik.io/description: Registra los proxy providers en el embedded outpost
entries:
  - model: authentik_outpost.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, Acervo Console]]
