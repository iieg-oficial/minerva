# Consola de Acervo (Filer UI de SeaweedFS) — proteccion via forward auth.
#
# SeaweedFS no tiene autenticacion propia, por eso la consola nunca se expuso.
# Aqui se crea un Proxy Provider en modo forward_single: gateway-hub valida cada
# request a /acervo/console/ contra el embedded outpost (auth_request) y, si no
# hay sesion, redirige al login de Authentik.
#
# El binding de este provider al embedded outpost vive en 90-embedded-outpost.yaml.
version: 1
metadata:
  name: IIEG - Consola de Acervo (forward auth)
  labels:
    blueprints.goauthentik.io/description: Proxy provider + application para la consola de Acervo
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: provider-acervo-console
    identifiers:
      name: Acervo Console
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: !Env [MINERVA_EXTERNAL_URL, "https://iieg.jalisco.gob.mx"]
      cookie_domain: !Env [MINERVA_COOKIE_DOMAIN, "iieg.jalisco.gob.mx"]
      access_token_validity: hours=24

  - model: authentik_core.application
    id: app-acervo-console
    identifiers:
      slug: acervo-console
    attrs:
      name: Consola de Acervo
      provider: !KeyOf provider-acervo-console
      meta_launch_url: !Format ["%s/acervo/console/", !Env [MINERVA_EXTERNAL_URL, "https://iieg.jalisco.gob.mx"]]
      meta_description: Filer UI de SeaweedFS (almacenamiento del ecosistema IIEG). Acceso restringido.
      meta_publisher: IIEG
      group: Infraestructura

  # Solo el admin global y los miembros de proj-acervo pueden entrar.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-acervo-console
      group: !Find [authentik_core.group, [name, tetlamamakani]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-acervo-console
      group: !Find [authentik_core.group, [name, proj-acervo]]
      order: 1
    attrs:
      enabled: true
