# Upstreams de la integracion de Minerva.
# Copiar a `nginx/conf.d/` de gateway-hub (junto a geoserver-upstream.conf).
#
# Nada que sustituir con envsubst: los hostnames son nombres de contenedor
# resueltos por la red Docker `iieg-network`.

upstream minerva {
    server minerva-server:9000;
    keepalive 16;
    keepalive_timeout 60s;
}

# Filer UI de SeaweedFS (consola de Acervo). No tiene auth propia:
# queda protegida por el forward auth de Minerva (ver acervo-console.locations.inc).
upstream acervo_console {
    server acervo-seaweedfs:8888;
    keepalive 16;
    keepalive_timeout 60s;
}
